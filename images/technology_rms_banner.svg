<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <!-- Dark gradient background matching site theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="40%" style="stop-color:#171412"/>
      <stop offset="70%" style="stop-color:#1E1916"/>
      <stop offset="100%" style="stop-color:#221D19"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0B429"/>
      <stop offset="100%" style="stop-color:#D4A017"/>
    </linearGradient>

    <!-- Red accent gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626"/>
      <stop offset="100%" style="stop-color:#C81E1E"/>
    </linearGradient>

    <!-- Subtle glow for tech elements -->
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F0B429;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#F0B429;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0"/>
    </radialGradient>

    <!-- Circuit pattern -->
    <pattern id="circuitPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <line x1="0" y1="40" x2="80" y2="40" stroke="#F0B429" stroke-width="0.3" opacity="0.08"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="#F0B429" stroke-width="0.3" opacity="0.08"/>
      <circle cx="40" cy="40" r="2" fill="#F0B429" opacity="0.1"/>
      <circle cx="0" cy="0" r="1.5" fill="#F0B429" opacity="0.06"/>
      <circle cx="80" cy="0" r="1.5" fill="#F0B429" opacity="0.06"/>
      <circle cx="0" cy="80" r="1.5" fill="#F0B429" opacity="0.06"/>
      <circle cx="80" cy="80" r="1.5" fill="#F0B429" opacity="0.06"/>
    </pattern>

    <!-- Dot grid pattern -->
    <pattern id="dotGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#F0B429" opacity="0.05"/>
    </pattern>

    <!-- Signal wave filter -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bgGrad)"/>

  <!-- Dot grid overlay -->
  <rect width="1920" height="600" fill="url(#dotGrid)"/>

  <!-- Circuit pattern overlay -->
  <rect width="1920" height="600" fill="url(#circuitPattern)"/>

  <!-- Large ambient glow areas -->
  <ellipse cx="1500" cy="300" rx="500" ry="350" fill="url(#glowGold)"/>
  <ellipse cx="300" cy="400" rx="400" ry="300" fill="url(#glowRed)"/>
  <ellipse cx="960" cy="150" rx="350" ry="250" fill="url(#glowCyan)"/>

  <!-- === CIRCUIT BOARD TRACES (Right Side) === -->
  <g opacity="0.15" stroke="#F0B429" stroke-width="1.5" fill="none">
    <!-- Horizontal traces -->
    <path d="M1200,180 L1400,180 L1420,200 L1600,200"/>
    <path d="M1250,240 L1380,240 L1400,260 L1550,260 L1570,240 L1700,240"/>
    <path d="M1180,320 L1350,320 L1370,340 L1500,340"/>
    <path d="M1300,400 L1450,400 L1470,380 L1620,380 L1640,400 L1780,400"/>
    <path d="M1220,460 L1400,460 L1420,440 L1560,440"/>

    <!-- Vertical traces -->
    <path d="M1400,140 L1400,180"/>
    <path d="M1500,200 L1500,340"/>
    <path d="M1620,240 L1620,380"/>
    <path d="M1350,320 L1350,460"/>

    <!-- Circuit nodes -->
    <circle cx="1400" cy="180" r="4" fill="#F0B429" opacity="0.4"/>
    <circle cx="1500" cy="200" r="4" fill="#F0B429" opacity="0.4"/>
    <circle cx="1500" cy="340" r="4" fill="#F0B429" opacity="0.4"/>
    <circle cx="1620" cy="240" r="4" fill="#F0B429" opacity="0.4"/>
    <circle cx="1620" cy="380" r="4" fill="#F0B429" opacity="0.4"/>
    <circle cx="1350" cy="320" r="4" fill="#F0B429" opacity="0.4"/>
    <circle cx="1350" cy="460" r="4" fill="#F0B429" opacity="0.4"/>

    <!-- IC Chip shapes -->
    <rect x="1460" y="250" width="80" height="50" rx="4" stroke-width="1.2"/>
    <line x1="1460" y1="260" x2="1445" y2="260"/>
    <line x1="1460" y1="275" x2="1445" y2="275"/>
    <line x1="1460" y1="290" x2="1445" y2="290"/>
    <line x1="1540" y1="260" x2="1555" y2="260"/>
    <line x1="1540" y1="275" x2="1555" y2="275"/>
    <line x1="1540" y1="290" x2="1555" y2="290"/>
  </g>

  <!-- === SATELLITE / ANTENNA ICON (Top Right) === -->
  <g transform="translate(1650, 80)" opacity="0.2">
    <!-- Dish -->
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#F0B429" stroke-width="1.5" transform="rotate(-30)"/>
    <!-- Arm -->
    <line x1="0" y1="0" x2="40" y2="50" stroke="#F0B429" stroke-width="1.5"/>
    <!-- Base -->
    <line x1="25" y1="60" x2="55" y2="60" stroke="#F0B429" stroke-width="1.5"/>
    <line x1="40" y1="50" x2="40" y2="60" stroke="#F0B429" stroke-width="1.5"/>
    <!-- Signal waves -->
    <path d="M-20,-30 Q-40,-50 -25,-70" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.6"/>
    <path d="M-30,-25 Q-55,-50 -35,-80" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.4"/>
    <path d="M-40,-20 Q-70,-50 -45,-90" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- === SOLAR PANEL ICON (Right-Center) === -->
  <g transform="translate(1720, 280)" opacity="0.12">
    <rect x="-60" y="-40" width="120" height="80" rx="4" fill="none" stroke="#F0B429" stroke-width="1.5"/>
    <!-- Panel grid lines -->
    <line x1="-60" y1="-13" x2="60" y2="-13" stroke="#F0B429" stroke-width="0.8"/>
    <line x1="-60" y1="13" x2="60" y2="13" stroke="#F0B429" stroke-width="0.8"/>
    <line x1="-20" y1="-40" x2="-20" y2="40" stroke="#F0B429" stroke-width="0.8"/>
    <line x1="20" y1="-40" x2="20" y2="40" stroke="#F0B429" stroke-width="0.8"/>
    <!-- Sun rays -->
    <circle cx="80" cy="-50" r="12" fill="none" stroke="#F0B429" stroke-width="1"/>
    <line x1="80" y1="-70" x2="80" y2="-65" stroke="#F0B429" stroke-width="1"/>
    <line x1="80" y1="-35" x2="80" y2="-30" stroke="#F0B429" stroke-width="1"/>
    <line x1="60" y1="-50" x2="65" y2="-50" stroke="#F0B429" stroke-width="1"/>
    <line x1="95" y1="-50" x2="100" y2="-50" stroke="#F0B429" stroke-width="1"/>
  </g>

  <!-- === WIFI / SIGNAL ICON (Center-top) === -->
  <g transform="translate(1100, 120)" opacity="0.18">
    <circle cx="0" cy="30" r="4" fill="#06B6D4"/>
    <path d="M-15,15 Q0,-5 15,15" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <path d="M-28,5 Q0,-25 28,5" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <path d="M-40,-5 Q0,-45 40,-5" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
  </g>

  <!-- === DATA FLOW LINES (connecting elements) === -->
  <g opacity="0.08" stroke="#06B6D4" stroke-width="1" stroke-dasharray="6,4">
    <path d="M800,300 Q950,200 1100,150" fill="none"/>
    <path d="M800,300 Q1000,350 1200,280" fill="none"/>
    <path d="M800,300 Q900,400 1100,450" fill="none"/>
    <path d="M1100,150 L1400,180" fill="none"/>
    <path d="M1200,280 L1460,275" fill="none"/>
    <path d="M1100,450 L1350,460" fill="none"/>
  </g>

  <!-- === CENTRAL MONITORING HUB ICON === -->
  <g transform="translate(800, 300)" filter="url(#softGlow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#F0B429" stroke-width="1" opacity="0.25"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#F0B429" stroke-width="0.5" opacity="0.15" stroke-dasharray="3,3"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="30" fill="#F0B429" opacity="0.06"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#F0B429" stroke-width="1.2" opacity="0.3"/>
    <!-- Monitor icon inside -->
    <rect x="-16" y="-12" width="32" height="20" rx="2" fill="none" stroke="#F0B429" stroke-width="1.2" opacity="0.5"/>
    <line x1="-6" y1="12" x2="6" y2="12" stroke="#F0B429" stroke-width="1.2" opacity="0.5"/>
    <line x1="0" y1="8" x2="0" y2="12" stroke="#F0B429" stroke-width="1.2" opacity="0.5"/>
    <!-- Signal dots on screen -->
    <circle cx="-6" cy="-2" r="1.5" fill="#06B6D4" opacity="0.8"/>
    <circle cx="0" cy="-5" r="1.5" fill="#22C55E" opacity="0.8"/>
    <circle cx="6" cy="-1" r="1.5" fill="#F0B429" opacity="0.8"/>
    <!-- Rotating markers on outer ring -->
    <circle cx="0" cy="-55" r="3" fill="#F0B429" opacity="0.4"/>
    <circle cx="55" cy="0" r="3" fill="#06B6D4" opacity="0.4"/>
    <circle cx="0" cy="55" r="3" fill="#DC2626" opacity="0.4"/>
    <circle cx="-55" cy="0" r="3" fill="#22C55E" opacity="0.4"/>
  </g>

  <!-- === BATTERY BMS ICON (Bottom right) === -->
  <g transform="translate(1550, 480)" opacity="0.15">
    <rect x="-30" y="-20" width="60" height="40" rx="4" fill="none" stroke="#22C55E" stroke-width="1.5"/>
    <rect x="30" y="-8" width="6" height="16" rx="2" fill="none" stroke="#22C55E" stroke-width="1"/>
    <!-- Charge bars -->
    <rect x="-24" y="-14" width="10" height="28" rx="1" fill="#22C55E" opacity="0.3"/>
    <rect x="-10" y="-8" width="10" height="22" rx="1" fill="#22C55E" opacity="0.25"/>
    <rect x="4" y="-2" width="10" height="16" rx="1" fill="#22C55E" opacity="0.2"/>
    <rect x="18" y="4" width="10" height="10" rx="1" fill="#22C55E" opacity="0.15"/>
    <!-- BMS label -->
    <text x="0" y="35" font-family="monospace" font-size="8" fill="#22C55E" opacity="0.5" text-anchor="middle">BMS</text>
  </g>

  <!-- === 4G LTE TOWER ICON (Left area) === -->
  <g transform="translate(200, 200)" opacity="0.12">
    <!-- Tower structure -->
    <line x1="0" y1="-60" x2="-20" y2="60" stroke="#F0B429" stroke-width="1.5"/>
    <line x1="0" y1="-60" x2="20" y2="60" stroke="#F0B429" stroke-width="1.5"/>
    <!-- Cross beams -->
    <line x1="-7" y1="-20" x2="7" y2="-20" stroke="#F0B429" stroke-width="1"/>
    <line x1="-13" y1="20" x2="13" y2="20" stroke="#F0B429" stroke-width="1"/>
    <!-- Signal waves -->
    <path d="M5,-55 Q25,-55 25,-35" fill="none" stroke="#DC2626" stroke-width="1"/>
    <path d="M8,-60 Q35,-60 35,-30" fill="none" stroke="#DC2626" stroke-width="0.8" opacity="0.6"/>
    <path d="M-5,-55 Q-25,-55 -25,-35" fill="none" stroke="#DC2626" stroke-width="1"/>
    <path d="M-8,-60 Q-35,-60 -35,-30" fill="none" stroke="#DC2626" stroke-width="0.8" opacity="0.6"/>
    <!-- 4G Label -->
    <text x="0" y="80" font-family="monospace" font-size="10" fill="#F0B429" opacity="0.4" text-anchor="middle">4G LTE</text>
  </g>

  <!-- === CLOUD ICON (Top center-left) === -->
  <g transform="translate(500, 100)" opacity="0.1">
    <path d="M-40,10 Q-40,-15 -20,-15 Q-15,-30 5,-30 Q25,-30 30,-15 Q50,-15 50,5 Q50,20 35,20 L-25,20 Q-40,20 -40,10Z" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <!-- Upload arrow -->
    <line x1="5" y1="30" x2="5" y2="10" stroke="#06B6D4" stroke-width="1.2"/>
    <polyline points="-2,17 5,10 12,17" fill="none" stroke="#06B6D4" stroke-width="1.2"/>
    <text x="5" y="45" font-family="monospace" font-size="8" fill="#06B6D4" opacity="0.6" text-anchor="middle">CLOUD</text>
  </g>

  <!-- === GPS LOCATION PIN (Lower left) === -->
  <g transform="translate(350, 420)" opacity="0.12">
    <path d="M0,-25 C-15,-25 -20,-12 -20,0 C-20,15 0,30 0,30 C0,30 20,15 20,0 C20,-12 15,-25 0,-25Z" fill="none" stroke="#DC2626" stroke-width="1.5"/>
    <circle cx="0" cy="-2" r="7" fill="none" stroke="#DC2626" stroke-width="1"/>
    <text x="0" y="45" font-family="monospace" font-size="8" fill="#DC2626" opacity="0.5" text-anchor="middle">GPS</text>
  </g>

  <!-- === DECORATIVE FLOATING PARTICLES === -->
  <g opacity="0.15">
    <circle cx="100" cy="100" r="2" fill="#F0B429">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="250" r="1.5" fill="#06B6D4">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="150" r="2" fill="#DC2626">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="450" r="1.5" fill="#F0B429">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1300" cy="100" r="2" fill="#22C55E">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1700" cy="180" r="1.5" fill="#06B6D4">
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1800" cy="500" r="2" fill="#F0B429">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="500" r="1.5" fill="#DC2626">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- === HORIZONTAL SCAN LINE EFFECT === -->
  <rect x="0" y="0" width="1920" height="1" fill="#F0B429" opacity="0.03">
    <animate attributeName="y" values="0;600;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- === BOTTOM ACCENT LINE === -->
  <rect x="0" y="596" width="1920" height="4" fill="url(#redGrad)" opacity="0.6"/>

  <!-- === SUBTLE TOP GRADIENT VIGNETTE === -->
  <rect x="0" y="0" width="1920" height="120" fill="url(#bgGrad)" opacity="0.3">
    <linearGradient id="topFade">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:0"/>
    </linearGradient>
  </rect>
</svg>